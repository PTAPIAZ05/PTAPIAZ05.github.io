<script>
  (function(){
    var params = new URLSearchParams(window.location.search);
    var id = window.PROJECT_ID || params.get('id');
    var project = PROJECTS[id];
    // Old links (project?id=bu-03) move to the clean address (/b-03).
    if (!window.PROJECT_ID && project){
      window.location.replace(id.replace(/^bu-/, 'b-').replace(/^ndot-/, 'n-').replace(/^research-/, 'r-'));
      return;
    }
    var root = document.getElementById('detail-root');

    if (!project){
      root.querySelector('.detail-header').innerHTML =
        '<div class="detail-eyebrow">NOT FOUND</div><h2>Project not found</h2>' +
        '<p style="color:var(--steel); margin-top:12px;">This project link doesn\'t match anything yet. Head back and pick one from the list.</p>';
      root.querySelector('.detail-layout').style.display = 'none';
      return;
    }

    document.getElementById('page-title').textContent = project.title + ' — Pedro Tapia Zamora';
    document.getElementById('d-section').textContent = project.section;
    document.getElementById('d-title').textContent = project.title;
    // Fill each section; hide any section that has no text yet.
    ['overview', 'approach', 'results'].forEach(function(key){
      var el = document.getElementById('d-' + key);
      el.textContent = project[key] || '';
      if (!project[key]) el.closest('.detail-block').style.display = 'none';
    });

    var img = document.getElementById('d-image');
    // Show the photo once it loads (and hide the placeholder box).
    img.addEventListener('load', function(){
      img.style.display = '';
      document.getElementById('d-image-fallback').style.display = 'none';
    });
    img.src = project.image;
    img.alt = project.title + ' project photo';
    document.getElementById('d-image-fallback').textContent = 'Photos coming soon';
    if (project.imageCaption){
      var capEl = document.getElementById('d-image-caption');
      capEl.textContent = project.imageCaption;
      capEl.hidden = false;
    }

    // Gallery: main photo first in the viewer, then the extra photos/videos.
    var media = project.media || [];
    var viewerItems = [{ type: 'image', src: project.image, caption: project.imageCaption || project.title }].concat(media);
    ProjectGallery.setAll(viewerItems);
    var photo = document.getElementById('d-photo');
    // Only offer the full-screen viewer once a photo has actually loaded.
    function photoReady(){ return img.naturalWidth > 0 && img.style.display !== 'none'; }
    img.addEventListener('load', function(){ photo.classList.add('is-zoomable'); });
    photo.setAttribute('role', 'button');
    photo.setAttribute('tabindex', '0');
    photo.setAttribute('aria-label', 'View photos full size');
    photo.addEventListener('click', function(){ if (photoReady()) ProjectGallery.open(viewerItems, 0); });
    photo.addEventListener('keydown', function(e){
      if ((e.key === 'Enter' || e.key === ' ') && photoReady()){ e.preventDefault(); ProjectGallery.open(viewerItems, 0); }
    });
    if (media.length){
      var photos = media.filter(function(m){ return m.type === 'image'; }).length;
      var videos = media.length - photos;
      var parts = [];
      if (photos) parts.push(photos + (photos === 1 ? ' photo' : ' photos'));
      if (videos) parts.push(videos + (videos === 1 ? ' video' : ' videos'));
      document.getElementById('d-gallery-count').textContent = parts.join(' · ');
      ProjectGallery.render(document.getElementById('d-gallery-grid'), media, 1);
      document.getElementById('d-gallery').hidden = false;
    }

    var tagsEl = document.getElementById('d-tags');
    // Each tag links back to the Projects page filtered to that skill.
    project.tags.forEach(function(tag){
      var link = document.createElement('a');
      link.textContent = tag;
      link.href = 'projects?tag=' + encodeURIComponent(tag);
      link.title = 'See all projects tagged ' + tag;
      tagsEl.appendChild(link);
    });

    var sectionLink = project.sectionLink || 'projects';
    document.getElementById('back-to-section').href = sectionLink;
    document.getElementById('back-to-section-btn').href = sectionLink;
  })();
</script>
